name: PMUPredict — ingestion et résultats

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pmupredict-backend/requirements.txt
      - run: pip install -r pmupredict-backend/requirements.txt
      - name: Vérifier URL PMU
        continue-on-error: true
        env:
          PMU_PROGRAMME_BASE_URL: ${{ secrets.PMU_PROGRAMME_BASE_URL }}
          RESULTS_API_URL: ${{ secrets.RESULTS_API_URL }}
        run: |
          python -c "from urllib.parse import urlparse; import os; u=urlparse(os.environ['PMU_PROGRAMME_BASE_URL']); print('PMU scheme:',u.scheme); print('PMU hostname:',u.hostname); print('PMU port:',u.port)"
          python -c "from urllib.parse import urlparse; import os; u=urlparse(os.environ['RESULTS_API_URL']); print('RESULT scheme:',u.scheme); print('RESULT hostname:',u.hostname); print('RESULT port:',u.port)"

      - name: Tester connexion Python PMU
        continue-on-error: true
        env:
          PMU_PROGRAMME_BASE_URL: ${{ secrets.PMU_PROGRAMME_BASE_URL }}
        run: |
          python -c "import requests,os; u=os.environ['PMU_PROGRAMME_BASE_URL']+'/programme/18082026/R1/C1/participants'; r=requests.get(u,params={'specialisation':'INTERNET'},timeout=15); print('HTTP:',r.status_code); print('URL:',r.url); print('BYTES:',len(r.content))"

      - name: Tester connexion Supabase Python
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python -c "import os,requests; u=os.environ['SUPABASE_URL'].rstrip('/')+'/rest/v1/hippodromes?select=id&limit=1'; r=requests.get(u,headers={'apikey':os.environ['SUPABASE_SERVICE_ROLE_KEY']}); print('HTTP:',r.status_code); print('LEN:',len(r.json()))"

      - name: Exécuter
        run: cd pmupredict-backend && python -m lib.ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PMU_PROGRAMME_BASE_URL: ${{ secrets.PMU_PROGRAMME_BASE_URL }}
          RESULTS_API_URL: ${{ secrets.RESULTS_API_URL }}
          MODEL_STORAGE_BUCKET: modeles
          APP_TIMEZONE: Europe/Paris
