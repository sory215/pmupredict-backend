name: PMUPredict — prédiction IA

on:
  schedule:
    - cron: '20 7 * * *'
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pmupredict-backend/requirements.txt
      - run: pip install -r pmupredict-backend/requirements.txt
      - name: Diagnostic date et courses
        run: |
          cd pmupredict-backend
          PYTHONPATH=lib python - <<'PYDIAG'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          from db import fetch_all

          tz = ZoneInfo(os.getenv('APP_TIMEZONE', 'Europe/Paris'))
          now = datetime.now(tz)
          today = now.date().isoformat()
          courses = fetch_all('courses', 'id,reunion_id,statut,heure_depart', page_size=1000)
          reunions = fetch_all('reunions', 'id,date', page_size=1000)
          rd = {r['id']: r['date'] for r in reunions}
          filtered = [c for c in courses if rd.get(c.get('reunion_id')) == today and c.get('statut') in ('a_venir', 'en_cours')]

          print('=== DIAGNOSTIC PREDICTION ===')
          print('APP_TIMEZONE =', os.getenv('APP_TIMEZONE'))
          print('now_local =', now.isoformat())
          print('today_local =', today)
          print('courses_total =', len(courses))
          print('reunions_total =', len(reunions))
          print('courses_filtrees =', len(filtered))
          for c in filtered[:10]:
              print('COURSE:', c)
          PYDIAG
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_TIMEZONE: Europe/Paris
      - name: Diagnostic liaison course-partants
        run: |
          cd pmupredict-backend
          PYTHONPATH=lib python - <<'PYDIAG'
          import os
          from db import supabase

          course_id = "07d67086-3b66-43e9-a42a-7a02441c2d94"
          rows = supabase.table("partants").select(
              "id,course_id,numero,cheval_nom"
          ).eq("course_id", course_id).execute().data or []

          print("=== DIAGNOSTIC COURSE-PARTANTS ===")
          print("course_id =", course_id)
          print("nb_partants =", len(rows))
          print("partants =", rows[:10])
          PYDIAG
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Diagnostic global des partants
        run: |
          cd pmupredict-backend
          PYTHONPATH=lib python - <<'PYDIAG'
          from db import supabase

          courses = supabase.table("courses").select(
              "id,reunion_id,numero,libelle"
          ).eq("reunion_id", "8f0d3567-7ace-429c-82c0-02470040ac95").execute().data or []

          ids = [c["id"] for c in courses]

          partants = supabase.table("partants").select(
              "id,course_id,numero,cheval_nom"
          ).limit(1000).execute().data or []

          lies = [p for p in partants if p.get("course_id") in ids]

          print("=== DIAGNOSTIC GLOBAL PARTANTS ===")
          print("courses_reunion =", len(courses))
          print("partants_total_lus =", len(partants))
          print("partants_lies =", len(lies))
          print("course_ids =", ids)
          print("premiers_partants =", partants[:10])
          PYDIAG
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Diagnostic direct courses-partants
        run: |
          cd pmupredict-backend
          PYTHONPATH=lib python - <<'PYDIAG'
          from db import supabase

          courses = supabase.table("courses").select(
              "id,reunion_id,numero,libelle"
          ).eq("reunion_id", "8f0d3567-7ace-429c-82c0-02470040ac95").execute().data or []

          print("=== DIAGNOSTIC DIRECT COURSES-PARTANTS ===")

          for c in courses:
              rows = supabase.table("partants").select(
                  "id,course_id,numero,cheval_nom"
              ).eq("course_id", c["id"]).execute().data or []

              print(
                  "COURSE",
                  c["numero"],
                  c["id"],
                  "PARTANTS",
                  len(rows),
                  rows[:3]
              )
          PYDIAG
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Diagnostic réponse PMU participants
        run: |
          cd pmupredict-backend
          python - <<'PYDIAG'
          import os
          import requests

          base = os.environ["PMU_PROGRAMME_BASE_URL"]
          url = f"{base}/programme/26092026/R1/C3/participants"

          r = requests.get(
              url,
              params={"specialisation": "INTERNET"},
              headers={"User-Agent": "pmupredict/1.0 (+https://pmupredict.app)"},
              timeout=20,
          )

          print("=== DIAGNOSTIC REPONSE PMU PARTICIPANTS ===")
          print("HTTP =", r.status_code)
          print("BYTES =", len(r.content))

          try:
              payload = r.json()
              print("TYPE =", type(payload).__name__)

              if isinstance(payload, dict):
                  participants = payload.get("participants", [])
                  print("PARTICIPANTS =", len(participants) if isinstance(participants, list) else "NON_LISTE")
                  if isinstance(participants, list) and participants:
                      print("PREMIER_KEYS =", sorted(participants[0].keys()))
                      print("PREMIER =", participants[0])
              elif isinstance(payload, list):
                  print("PARTICIPANTS =", len(payload))
                  if payload:
                      print("PREMIER_KEYS =", sorted(payload[0].keys()) if isinstance(payload[0], dict) else type(payload[0]).__name__)
                      print("PREMIER =", payload[0])
          except Exception as e:
              print("JSON_ERROR =", repr(e))
              print("BODY =", r.text[:1000])
          PYDIAG
        env:
          PMU_PROGRAMME_BASE_URL: ${{ secrets.PMU_PROGRAMME_BASE_URL }}

      - name: Exécuter
        run: python pmupredict-backend/lib/predict.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PMU_PROGRAMME_BASE_URL: ${{ secrets.PMU_PROGRAMME_BASE_URL }}
          RESULTS_API_URL: ${{ secrets.RESULTS_API_URL }}
          MODEL_STORAGE_BUCKET: modeles
          APP_TIMEZONE: Europe/Paris
